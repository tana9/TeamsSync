name: build

on:
  push:
  pull_request:
  schedule:
    - cron: '0 21 * * 1'
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install manual build tools
        run: |
          choco install go-task --no-progress --yes
          choco install pandoc --version=3.10.1 --no-progress --yes
      - name: Verify embedded manual
        run: task manual-check
      - name: Restore
        run: dotnet restore TeamsSync.slnx
      - name: Build
        run: dotnet build TeamsSync.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test TeamsSync.slnx --no-build --configuration Release
      - name: Vulnerability audit
        run: dotnet list TeamsSync.slnx package --vulnerable --include-transitive
      - name: Outdated package report
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: dotnet list TeamsSync.slnx package --outdated
